name: Build Native Android App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Native APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        working-directory: ./NativeYtDownloader
        run: chmod +x ./gradlew

      - name: Build Android APK (Debug)
        working-directory: ./NativeYtDownloader
        run: ./gradlew assembleDebug

      - name: Build Android AAB (Debug)
        working-directory: ./NativeYtDownloader
        run: ./gradlew bundleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: native-app-debug-apk
          path: NativeYtDownloader/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: native-app-debug-aab
          path: NativeYtDownloader/app/build/outputs/bundle/debug/app-debug.aab
